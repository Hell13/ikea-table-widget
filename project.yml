# Проект для XcodeGen: `brew install xcodegen && xcodegen` → DeskWidget.xcodeproj
name: DeskWidget
options:
  bundleIdPrefix: com.deskwidget
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: CP7YWDXQYA
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
targets:
  DeskAgent:
    type: application
    platform: macOS
    sources: [DeskAgent, Shared]
    settings:
      base:
        INFOPLIST_FILE: DeskAgent/Info.plist
        CODE_SIGN_ENTITLEMENTS: DeskAgent/DeskAgent.entitlements
        PRODUCT_NAME: "IKEA table widget"
        PRODUCT_BUNDLE_IDENTIFIER: com.deskwidget.agent
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: DeskWidgetExtension
        embed: true
  DeskWidgetExtension:
    type: app-extension
    platform: macOS
    sources: [DeskWidget, Shared/SharedState.swift]
    settings:
      base:
        INFOPLIST_FILE: DeskWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: DeskWidget/DeskWidget.entitlements
        PRODUCT_NAME: DeskWidgetExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.deskwidget.agent.widget
        GENERATE_INFOPLIST_FILE: NO
